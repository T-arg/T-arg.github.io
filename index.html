<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM a.r.g.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #fefefc;
            color: #584d4d;
            line-height: 1.6;
        }

        header {
            background-color: #584d4d;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #584d4d;
        }

        .banner {
            max-width: 600px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            color: #584d4d;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .about {
            background-color: #fefefc;
            padding: 30px;
            border-left: 5px solid #584d4d;
            border-radius: 5px;
            font-size: 1.1em;
            line-height: 1.8;
            margin: 20px 0;
        }

        .about p {
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #584d4d;
            color: #fefefc;
            margin-top: 40px;
        }

        a {
            color: #584d4d;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        footer a {
            color: #fefefc;
        }

        footer a:hover {
            color: #fefefc;
        }
    </style>
</head>
<body>
    <header>
        <img src="banner.png" alt="TEAM a.r.g. Banner" class="banner">
    </header>

    <div class="container">
        <h1>TEAM a.r.g.</h1>
        
        <div class="about">
            <p>TEAM a.r.g. is a small team (for now it's only me), created by Joeri Gantois aka JO3RI once upon a time started when Arduboy came to existence.</p>
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <p>Connect with us on <a href="https://github.com/T-arg">GitHub</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 TEAM a.r.g. All rights reserved.</p>
    </footer>
</body>
</html>
